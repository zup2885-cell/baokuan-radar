<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>爆款雷达</title>
<style>

:root{--bg:#f4f2ec;--card:#fffdf8;--ink:#211d18;--muted:#6f665b;--faint:#a39a8e;--line:#e3ddd2;--accent:#b8432a;--accent-bg:#f7e3dc;--warm:#9a6a1f;--warm-bg:#f6ecd6;--ok:#3d6b3a;--ok-bg:#e3efdc;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "PingFang SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button,.button-link{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--ink)}
button:hover,.button-link:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}
button.primary:hover{background:var(--ink);border-color:var(--ink)}
button:disabled{opacity:.6;cursor:wait}
:where(button,a,input,textarea,select,summary):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input,textarea,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:160px;line-height:1.75}
a{color:var(--ink)}
p{margin:0 0 12px}p:last-child{margin-bottom:0}
/* PC: 200px navigation + 340px list + flexible detail; reading measure <= 760px. */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);height:100vh;height:100dvh}
nav{min-width:0;border-right:1px solid var(--line);padding:24px 12px 16px;display:flex;flex-direction:column;gap:6px}
.brand{font:600 20px "Songti SC","STSong",serif;letter-spacing:.04em;padding:0 8px 24px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--accent);display:inline-grid;place-items:center;color:var(--card);font:600 13px sans-serif;font-style:normal}
nav a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer}
nav a.on{background:var(--card);color:var(--ink);font-weight:600}
nav a b{font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{margin-top:auto;font-size:12px;color:var(--muted);padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-wrap:anywhere}
.status-main{color:var(--ink);font-size:12px;line-height:1.75}
.status-last{margin-top:8px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dot{display:inline-block;flex:none;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warm)}.dot.bad{background:var(--accent)}
main{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 28px 20px;flex-shrink:0}
.page-heading{min-width:0}
header.bar h1{margin:0 0 5px;font:600 24px/1.4 "Songti SC","STSong",serif;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:0;line-height:1.7}
.header-control{width:auto;flex:none}.search-control{width:280px;max-width:40%}
.keyword-bar{display:flex;align-items:baseline;gap:12px;padding:0 28px 18px;flex-shrink:0}
.filter-label{font-size:13px;color:var(--muted);flex:none}
.chips{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 28px 18px;flex-shrink:0;min-width:0}
.keyword-bar .chips{padding:0;flex:1;min-width:0}
.chip{font-size:13px;padding:4px 10px;border-radius:6px;background:var(--card);border:1px solid var(--line);color:var(--ink);max-width:100%;overflow-wrap:anywhere}
.chip small{font-size:12px;color:var(--muted);margin-left:6px}
.chip.done small{color:var(--ok)}
.chip.err{background:var(--accent-bg);border-color:transparent}.chip.err small{color:var(--accent)}
.chip.pick{cursor:pointer}.chip.pick.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.split{flex:1;display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0;border-top:1px solid var(--line)}
.list{min-width:0;overflow:auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:10px;scrollbar-gutter:stable}
.item{display:grid;flex:none;width:100%;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;align-items:start}
.item.on{border-color:var(--accent);background:var(--accent-bg)}
.item img,.thumb{display:block;width:72px;height:96px;border-radius:8px;object-fit:cover;background:var(--line)}
.item-content{min-width:0}
.item h3{margin:0;font-size:15px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.item-author{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.item-stats{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.item-stats strong{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.item-source{font-size:13px;color:var(--muted);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;flex:none;white-space:nowrap;font-size:12px;line-height:1.65;padding:1px 6px;border-radius:5px;font-weight:500}
.badge.hot{background:var(--accent-bg);color:var(--accent)}
.badge.mid{background:var(--warm-bg);color:var(--warm)}
.badge.plain,.badge.saved{background:var(--bg);color:var(--muted)}
.item-state{font-size:12px;color:var(--muted);white-space:nowrap}
.detail{container-type:inline-size;min-width:0;overflow:auto;padding:28px clamp(20px,3vw,48px) 48px;border-left:1px solid var(--line);background:var(--card);scrollbar-gutter:stable}
.detail-inner{max-width:760px;margin-inline:auto;font-size:15px;line-height:1.75;overflow-wrap:anywhere}
.detail-head{display:grid;grid-template-columns:120px minmax(0,1fr);column-gap:24px;row-gap:16px;align-items:start}
.detail-cover{grid-row:1/4;width:120px;height:160px;object-fit:cover;border-radius:12px;background:var(--bg)}
.cover-placeholder{display:grid;place-items:center;font-size:12px;color:var(--muted)}
.detail-titlebox{min-width:0}
.detail h2{margin:0 0 8px;font:600 23px/1.5 "PingFang SC","Hiragino Sans GB",sans-serif;overflow-wrap:anywhere}
.detail-byline{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0}
.metric{min-width:0;display:flex;flex-direction:column}
.metric dd{order:-1;margin:0;font-size:21px;font-weight:600;line-height:1.4;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.metric dt{font-size:12px;color:var(--muted);margin-top:4px}
.metric.ratio dd{color:var(--accent)}
.detail-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px}
.detail-actions .button-link{font-size:13px}
.detail-actions select{width:auto;max-width:100%;font-size:13px}
.detail-context{margin-top:20px;color:var(--muted);font-size:13px}
.analysis-status:empty{display:none}
.analysis-status .msg{margin:20px 0 0}
.msg{font-size:13px;padding:12px 16px;border-radius:12px;background:var(--bg);line-height:1.75;overflow-wrap:anywhere}
.msg.error{background:var(--accent-bg);color:var(--accent)}
.detail-tabs{display:flex;flex-wrap:wrap;gap:4px 16px;margin:24px 0;border-bottom:1px solid var(--line)}
.detail-tabs button{min-height:42px;padding:8px 0 12px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;font-size:14px;color:var(--muted);white-space:nowrap}
.detail-tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.tab-panel{display:flex;flex-direction:column;gap:24px;outline:none}
.section-title,.reading-card h3,.card h3{margin:0 0 12px;font-size:13px;line-height:1.6;font-weight:500;color:var(--muted);letter-spacing:.05em}
.reading-card,.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.conclusion{background:var(--accent-bg);border:0}
.conclusion p{font-size:18px;font-weight:600;line-height:1.75}
blockquote{margin:0 0 16px;padding:2px 0 2px 14px;border-left:3px solid var(--accent);white-space:pre-wrap;overflow-wrap:anywhere}
blockquote:last-child{margin-bottom:0}
.small-note,.hint{font-size:13px;color:var(--muted);line-height:1.75;margin-top:8px}
.reasons,.topic-cards,.takeaway-cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.reasons>li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:12px}
.ordinal{font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.6}
.reason-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.evidence{color:var(--muted);font-size:14px;margin:0}
.takeaway-cards strong{display:block;margin-bottom:14px}
.application-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.micro-label{font-size:13px;color:var(--muted);margin-bottom:8px}
.application{padding:14px 16px;background:var(--accent-bg);border-radius:8px}
.application .micro-label{color:var(--accent)}
.avoid{background:var(--bg)}
.avoid summary{cursor:pointer;font-size:13px;color:var(--muted);letter-spacing:.05em}
.avoid-entry{margin-top:16px}.avoid-entry p{margin-top:6px}
.timeline{list-style:none;padding:0;margin:0;counter-reset:step}
.timeline li{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:14px;position:relative;padding-bottom:20px;counter-increment:step}
.timeline li:last-child{padding-bottom:0}
.timeline li:not(:last-child):before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:1px;background:var(--line)}
.step-number{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--bg);font-size:13px;color:var(--muted)}
.template-text{white-space:pre-wrap;margin:0;font:inherit}
.section-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}.section-top h3{margin:0}
.section-top button{flex:none;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.topic-cards h3{font-size:17px;letter-spacing:0;color:var(--ink);font-weight:600}
.topic-cards ul{padding-left:20px;margin:12px 0 16px}.topic-cards li{margin:5px 0}
.transcript{font:15px/1.9 "PingFang SC","Hiragino Sans GB",sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
.transcript p{margin-bottom:20px}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
.notes-card label:first-child{margin-top:0}
.form-actions{display:flex;gap:12px;align-items:center;margin-top:16px}
.unsaved{font-size:13px;color:var(--accent)}
.empty-state{color:var(--muted);padding:40px 16px;text-align:center;line-height:1.9}
.missing-content{color:var(--muted);font-size:14px;margin:0;line-height:1.75}
.settings,.hot-content{min-width:0;overflow:auto;padding:4px 28px 40px;flex:1}
.settings-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.settings .card h3{padding-bottom:12px;border-bottom:1px solid var(--line)}
.settings .msg{margin:12px 0}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input[type="checkbox"]{width:auto;accent-color:var(--accent)}
.inline label{margin:0;color:var(--ink);font-size:14px}
.log{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);padding:10px 0;overflow-wrap:anywhere}.log:last-child{border:0;padding-bottom:0}
.hot-filters button{flex:none;white-space:nowrap;font-size:13px;padding:5px 11px}
.hot-filters button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.hot-filters .count{margin-left:6px;font-variant-numeric:tabular-nums}
.hot-notice{padding:0 28px 20px;color:var(--muted);font-size:13px}
.hot-table{max-width:1200px;margin:0 auto}
.hotrow{display:grid;grid-template-columns:40px minmax(0,1fr) 110px minmax(140px,.65fr) 100px;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.hotrow:last-child{border:0}
.hotrow.head{padding:0 0 12px;font-size:13px;color:var(--muted)}
.hotrow .n{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}.hotrow.top .n{color:var(--accent);font-weight:600}
.hot-word{font-size:15px;overflow-wrap:anywhere}
.hot-track{min-width:0}.hot-track .badge{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.hot-flags{display:flex;flex-wrap:wrap;gap:6px;min-width:0}.hot-flags .badge{white-space:normal;overflow-wrap:anywhere}
.hot-value{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:10px;font-size:13px;z-index:9}
/* 演示版只扩展外壳与占位图；本地模式继续沿用原来的布局。 */
html[data-radar-static] body{display:flex;flex-direction:column}
html[data-radar-static] .app{height:auto;min-height:0;flex:1}
html[data-radar-static] [data-local-only]{display:none!important}
.demo-banner{flex:none;padding:14px 28px;background:var(--warm-bg);color:var(--ink);font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.demo-banner a{text-underline-offset:3px;font-weight:600}
.demo-cover{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;background:var(--accent-bg);color:var(--accent);text-align:left}
.demo-cover strong{font:600 32px/1.2 "Songti SC","STSong",serif}
.demo-cover small{font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.detail-cover.demo-cover{padding:18px}.detail-cover.demo-cover strong{font-size:56px}
html[data-radar-static] .detail-context,html[data-radar-static] .detail-byline{overflow-wrap:anywhere}
html[data-radar-static] .badge{max-width:100%;white-space:normal;overflow-wrap:anywhere}
@media(max-width:899px){html[data-radar-static] body{height:auto;min-height:100vh}.demo-banner{padding:12px 20px}html[data-radar-static] .app{flex:none}html[data-radar-static] .detail-cover.demo-cover strong{font-size:40px}}
@container(max-width:640px){.detail-cover{grid-row:1}.metrics,.detail-actions{grid-column:1/-1}.metric dd{font-size:20px}.application-grid{grid-template-columns:1fr}.detail-head{column-gap:20px}.detail-tabs{gap:4px 14px}}
@container(max-width:520px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@container(max-width:420px){.detail-head{grid-template-columns:96px minmax(0,1fr);column-gap:16px}.detail-cover{width:96px;height:128px}.detail h2{font-size:20px}.grid2{grid-template-columns:1fr}.reading-card{padding:16px}.detail-tabs{gap:4px 12px}.detail-tabs button{font-size:13px}}
@media(max-width:1100px){.hotrow{grid-template-columns:32px minmax(0,1fr) 90px 140px 80px;gap:12px}.settings-grid{grid-template-columns:1fr;max-width:760px}}
@media(max-width:899px){.app{height:auto;min-height:100vh;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}nav{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}.brand{padding:0 14px 0 0}.status{display:none}nav a{padding:8px 10px}main{overflow:visible}header.bar{padding:24px 20px 18px;flex-wrap:wrap;gap:14px}.keyword-bar{padding:0 20px 18px;flex-wrap:wrap;gap:8px}.chips{padding-inline:20px}.split{grid-template-columns:minmax(0,1fr);flex:none}.list{max-height:360px;padding:16px 20px}.item{grid-template-columns:72px minmax(0,1fr)}.detail{overflow:visible;border-left:0;border-top:1px solid var(--line);padding:24px 20px 40px}.settings,.hot-content{overflow:visible;padding-inline:20px}.hot-notice{padding-inline:20px}.search-control{width:100%;max-width:100%}.grid2{gap:16px}.hotrow{grid-template-columns:28px minmax(0,1fr) 80px;gap:8px 12px}.hot-word{grid-column:2;grid-row:1}.hot-track{grid-column:2;grid-row:2}.hot-flags{grid-column:2;grid-row:3}.hot-value{grid-column:3;grid-row:1/4}.hotrow .n{grid-column:1;grid-row:1}.hotrow.head{display:none}}
</style>
</head>
<body>
<aside class="demo-banner" id="demoBanner" aria-label="演示版说明" hidden></aside>
<div class="app">
  <nav aria-label="主导航">
    <div class="brand"><i>爆</i>爆款雷达</div>
    <a role="button" tabindex="0" data-view="today" class="on">今日爆款 <b id="nToday"></b></a>
    <a role="button" tabindex="0" data-view="hot">热榜</a>
    <a role="button" tabindex="0" data-view="library">收藏库 <b id="nSaved"></b></a>
    <a role="button" tabindex="0" data-view="settings" data-local-only>设置</a>
    <div class="status" id="status">读取中…</div>
  </nav>
  <main id="main"></main>
</div>
<script>
const STATIC=window.RADAR_STATIC===true;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':n>=10000?(n/10000).toFixed(n>=100000?0:1)+' 万':n.toLocaleString();
let S=null,view='today',renderedView=null,day=null,items=[],current=null,libQ='',libTag='',timer=null,followToday=true,pageVersion=0,listVersion=0,detailVersion=0,stateVersion=0,hotVersion=0,hotFilter='',refreshing=false,shownJobResult='';
const PLATFORM_NAMES={douyin:'抖音',bilibili:'B站',youtube:'YouTube',x:'X'};
const platformFilter={today:'',library:'',hot:''};
const analysisSelections={};
const platformOf=v=>v.platform||'douyin';
const formula=v=>platformOf(v)==='douyin'?'点赞 ÷ 粉丝':platformOf(v)==='youtube'?'播放 ÷ 订阅':'播放 ÷ 粉丝';
const platformBadge=v=>`<span class="badge plain">${esc(PLATFORM_NAMES[platformOf(v)]||'未知平台')}</span>`;
function platformHTML(hot=false){return `<div class="chips" id="platformFilters" role="group" aria-label="平台筛选">${[['','全部'],...Object.entries(PLATFORM_NAMES).filter(([p])=>hot||p!=='x')].map(([p,n])=>`<button class="chip pick ${platformFilter[view]===p?'on':''}" data-platform="${p}" aria-pressed="${platformFilter[view]===p}">${n}</button>`).join('')}</div>`}
function bindPlatforms(){const box=$('#platformFilters');if(!box)return;box.querySelectorAll('button').forEach(b=>b.onclick=async()=>{platformFilter[view]=b.dataset.platform;current=null;if(view==='hot')await renderHot();else {box.querySelectorAll('button').forEach(button=>{const on=button.dataset.platform===platformFilter[view];button.classList.toggle('on',on);button.setAttribute('aria-pressed',String(on))});if(view==='today')updateTodayMeta();if(view==='library')await updateTags();await loadList()}})}
let snapshotPromise=null;
async function staticData(){
  if(!snapshotPromise)snapshotPromise=(async()=>{const r=await fetch('./data.json');if(!r.ok)throw new Error('无法读取演示快照，请刷新页面重试');const j=await r.json();if(!j.snapshot_date||!Array.isArray(j.videos)||!Array.isArray(j.hot)||!Array.isArray(j.keywords)||!Array.isArray(j.tracks))throw new Error('演示快照格式不正确，请重新导出');return j})().catch(e=>{snapshotPromise=null;throw e});
  return snapshotPromise;
}
async function staticAPI(path,body){
  if(body!==undefined)throw new Error('演示版只能查看，完整工具请在自己的 Mac 上运行');
  const [route,query='']=path.split('?'),q=new URLSearchParams(query),d=await staticData();
  const videos=d.videos.filter(v=>v.status==='done'),saved=videos.filter(v=>v.saved),platform=q.get('platform')||'',matchesPlatform=v=>!platform||platformOf(v)===platform;
  if(route==='/api/state')return {today:d.snapshot_date,day:d.snapshot_date,days:[d.snapshot_date],settings:{field:d.field},keywords:d.keywords,today_keywords:d.keywords,saved:saved.length,today_count:videos.filter(v=>v.day===d.snapshot_date).length,job:{name:null,result:''}};
  if(route==='/api/videos'){
    let rows=q.get('view')==='library'?saved:videos.filter(v=>v.day===d.snapshot_date);
    const needle=(q.get('q')||'').trim().toLocaleLowerCase(),tag=q.get('tag');
    if(needle)rows=rows.filter(v=>[v.desc,v.author,v.keyword,v.transcript_excerpt,JSON.stringify(v.analysis),...(v.tags||[])].join('\n').toLocaleLowerCase().includes(needle));
    if(tag)rows=rows.filter(v=>(v.tags||[]).includes(tag));

    button.onkeydown=e=>{let next;if(e.key==='ArrowRight')next=(i+1)%buttons.length;else if(e.key==='ArrowLeft')next=(i-1+buttons.length)%buttons.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=buttons.length-1;else return;e.preventDefault();buttons[next].onclick();buttons[next].focus()};
  });
}

  $('#login').onclick=async()=>{const j=await api('/api/login',{});toast(j.ok?'扫码窗口打开中，请用小号扫码':'正在忙：'+j.busy);refresh()};
  $('#challenge').onclick=async()=>{const j=await api('/api/challenge',{});toast(j.ok?'验证窗口打开中':'正在忙：'+j.busy);refresh()};
  $('#saveSet').onclick=async()=>{try{await api('/api/settings',{screening_provider:$('#screeningProvider').value,analysis_provider:$('#analysisProvider').value,qwen_model:$('#qwenModel').value,douyin_min_ratio:$('#ratio-douyin').value,field:$('#field').value,fixed_keywords:$('#fixed').value.split(/[,，、]+/),keywords_per_day:$('#kpd').value,per_keyword:$('#pk').value,min_likes:$('#ml').value,recent_days:$('#rd').value,auto:$('#auto').checked,active_start:$('#as').value,active_end:$('#ae').value,search_gap_minutes:$('#gap').value,...Object.fromEntries(Object.keys(PLATFORM_NAMES).map(p=>[p+'_enabled',$('#enable-'+p).checked])),...Object.fromEntries(['bilibili','youtube'].flatMap(p=>[[p+'_search_gap_minutes',$('#gap-'+p).value],[p+'_min_views',$('#min-'+p).value],[p+'_min_ratio',$('#ratio-'+p).value]])),youtube_fixed_keywords:$('#english').value.split(/[,，、]+/),youtube_searches_per_day:$('#ytLimit').value,youtube_hot_category:$('#ytCategory').value});toast('设置已保存');await loadState();if(view==='settings')renderSettings()}catch(e){toast(e.message)}};
  updateSettingsStatus();
}
document.querySelectorAll('nav a').forEach(a=>{a.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();a.onclick()}};a.onclick=async()=>{if(STATIC&&a.dataset.view==='settings')return;const page=++pageVersion;view=a.dataset.view;current=null;await loadState();if(page!==pageVersion)return;await render();if(page===pageVersion&&(view==='today'||view==='library'))await loadList()}});
loadState().then(async()=>{if(pageVersion)return;await render();if(!pageVersion)await loadList()}).catch(e=>{$('#main').innerHTML='<div class="empty-state">'+(STATIC?'演示快照加载失败：':'服务没有连上：')+esc(e.message)+'</div>';scheduleRefresh()});
</script>
</body>
</html>
